{% extends "base.html" %}

{% block title %}Page Not Found - DisasterAlert{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 5rem 1rem;">
    <i class="fas fa-exclamation-circle" style="font-size: 5rem; color: #f59e0b; margin-bottom: 2rem;"></i>
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">404 - Page Not Found</h1>
    <p style="color: #666; font-size: 1.1rem; margin-bottom: 2rem;">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="/" class="btn btn-primary">Go to Homepage</a>
</div>
{% endblock %}
